name: Update Pebrel

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pebrel
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-15
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}

    steps:
      - name: Check out tap
        uses: actions/checkout@v5

      - name: Update cask metadata
        run: ruby script/update-pebrel

      - name: Detect cask changes
        id: changes
        run: |
          if git diff --quiet -- Casks/pebrel.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run updater tests
        run: ruby test/cask_updater_test.rb

      - name: Register checkout as a tap
        if: steps.changes.outputs.changed == 'true'
        run: brew tap zanderzhng/tap "file://$GITHUB_WORKSPACE" --custom-remote

      - name: Trust this tap
        if: steps.changes.outputs.changed == 'true'
        run: brew trust zanderzhng/tap

      - name: Copy updated cask into local tap
        if: steps.changes.outputs.changed == 'true'
        run: cp Casks/pebrel.rb "$(brew --repository zanderzhng/tap)/Casks/pebrel.rb"

      - name: Check cask style
        if: steps.changes.outputs.changed == 'true'
        run: brew style --cask zanderzhng/tap/pebrel

      - name: Audit cask
        if: steps.changes.outputs.changed == 'true'
        run: brew audit --cask --online zanderzhng/tap/pebrel

      - name: Commit update
        if: steps.changes.outputs.changed == 'true'
        run: |
          if git diff --quiet -- Casks/pebrel.rb; then
            echo "Cask is already current."
            exit 0
          fi

          # Ruby, not the shell, expands $_ and $1 below.
          # shellcheck disable=SC2016
          version="$(ruby -ne 'puts $1 if $_ =~ /^\s*version "([^"]+)"$/' Casks/pebrel.rb)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Casks/pebrel.rb
          git commit -m "chore: update pebrel to ${version}"
          git push
